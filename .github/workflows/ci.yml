name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    name: host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and run host test suite
        run: make -C tests/host run

  sanitizers:
    name: asan + ubsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run the suite under ASan and UBSan
        run: |
          make -C tests/host clean
          make -C tests/host \
            CFLAGS="-std=c11 -Wall -Wextra -O1 -g -fsanitize=address,undefined -I$PWD/src" run

  cpp-headers:
    name: headers compile as C++11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Every source file as C++11
        run: |
          set -eu
          for f in src/*.c; do
            g++ -std=c++11 -Wall -Wextra -Werror -pedantic -O2 -Isrc -x c++ -c "$f" -o /tmp/$(basename "$f").o
          done
          echo "all sources compile as C++11"

  codegen:
    name: codegen in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Generator self-check
        run: python3 tools/fis2h.py --selftest
      - name: Regenerate headers from every tracked .fis (auto-discovered)
        run: |
          set -eu
          python3 tools/scan_fis_codegen.py
      - name: Committed headers must match generator output
        run: git diff --exit-code
      - name: Generated headers compile clean (C99)
        run: |
          set -eu
          python3 tools/scan_fis_codegen.py --compile

  arduino:
    name: arduino-cli ${{ matrix.fqbn }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fqbn:
          - arduino:avr:uno
          - arduino:avr:mega
          - esp8266:esp8266:nodemcuv2
          - esp32:esp32:esp32
          - STMicroelectronics:stm32:GenF4
    steps:
      - uses: actions/checkout@v5
      - name: Install arduino-cli
        run: |
          mkdir -p "$PWD/bin"
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh \
            | BINDIR="$PWD/bin" sh
          echo "$PWD/bin" >> "$GITHUB_PATH"
      - name: Install cores
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli config add board_manager.additional_urls \
            https://github.com/stm32duino/BoardManagerFiles/raw/main/package_stmicroelectronics_index.json
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli core install esp8266:esp8266
          arduino-cli core install esp32:esp32
          arduino-cli core install STMicroelectronics:stm32
      - name: Compile every example
        run: |
          set -eu
          for ex in examples/*/; do
            echo "== $ex"
            arduino-cli compile --fqbn "${{ matrix.fqbn }}" --library . --warnings all "$ex"
          done

  parity:
    name: parity vs fis2json (MATLAB semantics)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Run parity over every golden fixture
        run: |
          set -eu
          ./tools/check_all_parity.sh

  stm32f103:
    name: stm32f103 cross-compile (float + double)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install arm-none-eabi-gcc
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi
      - name: Build and size STM32F103 (Cortex-M3, float32)
        run: make -C tests/stm32f103 run
      - name: Build STM32F103 with FZ_DOUBLE=1 (64-bit)
        run: |
          set -eu
          make -C tests/stm32f103 clean
          make -C tests/stm32f103 run FZ_DOUBLE=1
